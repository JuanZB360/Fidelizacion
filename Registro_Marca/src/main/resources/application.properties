spring.application.name=Registro_Marca


# Base de datos H2 en memoria (se destruye al cerrar el proceso)
spring.datasource.url=jdbc:h2:mem:fidelizaciondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: create-drop borra el esquema al cerrar y lo crea al iniciar
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcional: activar la consola web de H2 para inspeccionar mientras corre
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración del servidor SMTP de Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=fidelizacionmarca@gmail.com
spring.mail.password=rsseanfhignrdfli

# Propiedades del protocolo SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


