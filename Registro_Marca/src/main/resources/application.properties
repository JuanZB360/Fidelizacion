spring.application.name=Registro_Marca

# Configuración de base de datos H2 persistente en disco (los registros y sus IDs se conservan siempre)
spring.datasource.url=jdbc:h2:file:./data/fidelizaciondb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de Dialecto de JPA / Hibernate (update conserva tablas y registros al reiniciar)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Activar la consola web de H2 para visualizar tablas e insertar datos desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console