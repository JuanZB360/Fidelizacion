spring.application.name=Registro_Marca

# Configuración de H2 en memoria
spring.datasource.url=jdbc:h2:mem:fidelizaciondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de Dialecto de JPA / Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Activar la consola web de H2 para visualizar tablas e insertar datos desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console